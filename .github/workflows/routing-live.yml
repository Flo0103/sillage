name: Diagnostic OSM en ligne

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/routing-live.yml
      - server/check-routing.js
      - server/routing.js
      - server/local-routing.js
      - server/stored-osm.js

permissions:
  contents: read

jobs:
  villes:
    name: ${{ matrix.place }} avec les fournisseurs publics (facultatif)
    strategy:
      fail-fast: false
      matrix:
        include:
          - place: Aachen
            from: 50.7715,6.075
            to: 50.7715,6.087
          - place: Maastricht
            from: 50.825,5.685
            to: 50.823,5.711
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Examiner le guidage des deux points publics de Maastricht
        if: matrix.place == 'Maastricht'
        run: |
          node --input-type=module <<'NODE'
          const base='https://routing.openstreetmap.de/routed-bike/route/v1/driving/5.684113,50.8243674;5.711,50.823?overview=false&steps=false&annotations=nodes&radiuses=';
          for (const [label,radius] of [['encoded','150%3B150'],['raw','150;150'],['wide','1000;1000']]) {
            try { const response=await fetch(base+radius,{signal:AbortSignal.timeout(20000)}),data=await response.json();console.log(JSON.stringify({label,status:response.status,code:data.code,message:data.message,distance:data.routes?.[0]?.distance,offsets:data.waypoints?.map(w=>w.distance)})); }
            catch(error){console.log(JSON.stringify({label,error:error.cause?.code||error.name}));}
            await new Promise(resolve=>setTimeout(resolve,1000));
          }
          NODE
      - name: Accrochage, aller et retour, sans base ni compte
        run: node server/check-routing.js --online --from '${{ matrix.from }}' --to '${{ matrix.to }}'
