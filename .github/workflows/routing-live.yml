name: Diagnostic OSM en ligne

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/routing-live.yml
      - server/check-routing.js
      - server/routing.js
      - server/osm.js
      - server/local-routing.js
      - server/stored-osm.js

permissions:
  contents: read

jobs:
  villes:
    name: ${{ matrix.place }} avec les fournisseurs publics (facultatif)
    strategy:
      fail-fast: false
      matrix:
        include:
          - place: Aachen
            from: 50.7715,6.075
            to: 50.7715,6.087
          - place: Maastricht
            from: 50.825,5.685
            to: 50.823,5.711
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Accrochage, aller et retour, sans base ni compte
        run: node server/check-routing.js --online --from '${{ matrix.from }}' --to '${{ matrix.to }}'
